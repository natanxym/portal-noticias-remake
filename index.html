<!doctype html>
<html lang="pt-br">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portal de notícias remake</title>

    <link rel="stylesheet" href="styles/index.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="grid container">
      <div id="primary" class="grid grid-flow-col">
        <div class="grid grid-flow-col">
          <img src="assets/icons/List.svg" alt="" />
          <h2>Menu</h2>
        </div>
        <div>
          <h1>TECH NEWS</h1>
        </div>
        <div class="grid grid-flow-col">
          <h2>Buscar</h2>
          <img src="assets/icons/MagnifyingGlass.svg" alt="" />
        </div>
      </div>

      <div id="secondary" class="grid grid-flow-col">
        <a href="#">Inteligência Artificial</a>
        <a href="#">Blockchain</a>
        <a href="#">Hologramas</a>
        <a href="#">Internet</a>
        <a href="#">Vestíveis</a>
        <a href="#">Realidade Aumentada</a>
        <a href="#">Realidade Virtual</a>
      </div>
    </header>
    <main class="container">
      <section id="featured" class="grid grid-flow-col gap-16">
        <figure class="grid card">
          <img src="assets/images/Image 01.png" alt="" />
          <figcaption>
            <span>Robótica</span>
            <h1>
              Robôs domésticos começam a ser adotados para tarefas diárias,
              prometendo mais conforto e eficiência nas residências.
            </h1>
          </figcaption>
        </figure>

        <div class="grid grid-col-2 gap-16">
          <figure class="card">
            <img src="assets/images/Image 02.png" alt="" />
            <figcaption>
              <span>Hologramas</span>
              <h3>
                Novo Smartphone Projetor 3D chega ao mercado, transformando a
                forma como vemos nossas telas!
              </h3>
            </figcaption>
          </figure>
          <figure class="card">
            <img src="assets/images/Image 03.png" alt="" />
            <figcaption>
              <span>Internet</span>
              <h3>
                Tecnologia 6G chega às metrópoles brasileiras, prometendo
                revolucionar a forma como vivemos e nos comuni...
              </h3>
            </figcaption>
          </figure>
          <figure class="card">
            <img src="assets/images/Image 04.png" alt="" />
            <figcaption>
              <span>Vestíveis</span>
              <h3>
                Empresa lança relógio inteligente capaz de monitorar a saúde
                mental, oferecendo insights valiosos para o...
              </h3>
            </figcaption>
          </figure>
          <figure class="card">
            <img src="assets/images/Image 05.png" alt="" />
            <figcaption>
              <span>Realidade Virtual</span>
              <h3>Escolas adotam a tecnologia VR para proporcionar experiências imersivas, transformando a aprendizagem tradi...</h3>
            </figcaption>
          </figure>
        </div>
      </section>

      <section id="weekly"></section>
    </main>
  </body>
</html>
